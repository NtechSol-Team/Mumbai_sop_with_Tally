databases:
  - name: mumbai-erp-postgres
    plan: free
    region: singapore
    databaseName: mumbai_erp
    user: mumbai_erp
    # The API uses the internal connection string; the database needs no public ingress.
    ipAllowList: []

services:
  # ── API (Express + Prisma + Socket.IO + pg-boss, all in one process) ──────
  - type: web
    name: mumbai-erp-ntechsol-api
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: >
      npm ci --include=dev &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma &&
      npm run api:build
    startCommand: node apps/api/dist/server.js
    initialDeployHook: npx tsx apps/api/prisma/seed.ts
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Render otherwise performs an implicit production-only npm install before
      # buildCommand, which cannot run the root patch-package postinstall.
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: 20.19.5
      - key: PORT
        value: 4000
      - key: API_PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: mumbai-erp-postgres
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: SEED_PASSWORD
        generateValue: true
      # 27 = Maharashtra (Mumbai). CONFIRM against the client's GST certificate.
      - key: HOME_STATE_CODE
        value: "27"
      - key: WEB_ORIGIN
        value: https://mumbai-erp-ntechsol-web.onrender.com

  # ── Web (Next.js) ───────────────────────────────────────────────────────────
  - type: web
    name: mumbai-erp-ntechsol-web
    runtime: static
    rootDir: .
    buildCommand: npm ci --include=dev && npm run web:build
    staticPublishPath: apps/web/out
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_INSTALL_DEPS
        value: "true"
      - key: NODE_VERSION
        value: 20.19.5
      - key: STATIC_EXPORT
        value: "true"
      - key: NEXT_PUBLIC_API_URL
        value: https://mumbai-erp-ntechsol-api.onrender.com
