name: Tally Agent Windows Installer
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/tally-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/tally-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Windows x64 installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check packaged Windows application
        shell: pwsh
        run: |
          $env:MUMBAI_ERP_TALLY_CONFIG = Join-Path $env:RUNNER_TEMP 'arthx-smoke/config.json'
          $env:ARTHX_SMOKE_OUTPUT = Join-Path $env:RUNNER_TEMP 'arthx-tally-smoke.json'
          $app = Start-Process -FilePath '.\dist\win-unpacked\Arthx Tally Sync Agent.exe' -ArgumentList '--smoke-test' -PassThru
          if (-not $app.WaitForExit(60000)) { $app.Kill(); throw 'Packaged app smoke check timed out' }
          if ($app.ExitCode -ne 0) { throw "Packaged app failed with exit code $($app.ExitCode)" }
          $result = Get-Content $env:ARTHX_SMOKE_OUTPUT | ConvertFrom-Json
          if (-not ($result.ok -and $result.packaged -and $result.preloadReady -and $result.iconReady -and $result.platform -eq 'win32')) { throw 'Packaged app verification failed' }
          $result | ConvertTo-Json | Set-Content dist/windows-smoke-result.json
          Get-ChildItem dist/*Setup*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: arthx-tally-agent-windows
          if-no-files-found: error
          retention-days: 30
          path: |
            apps/tally-agent/dist/*Setup*.exe
            apps/tally-agent/dist/*Setup*.exe.sha256
            apps/tally-agent/dist/windows-smoke-result.json
